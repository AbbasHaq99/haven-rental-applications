services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?Set SQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  web:
    build: .
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=Haven;User Id=sa;Password=${SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Seed__Enabled: "true"
      Seed__DemoPassword: ${DEMO_PASSWORD:-HavenDemo!2026}
    depends_on:
      sqlserver:
        condition: service_healthy
volumes:
  sql-data:
